apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-api
  labels:
    app: tempo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo-api
  template:
    metadata:
      labels:
        app: tempo-api
    spec:
      containers:
        - name: tempo-api
          image: tempo-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTHORIZED_ADMIN_EMAILS
              value: "lucasshawn@gmail.com"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi